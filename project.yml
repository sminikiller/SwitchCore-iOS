name: SwitchCore
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 1,2
    HEADER_SEARCH_PATHS: ['$(SRCROOT)', '$(SRCROOT)/third_party/nexo/src', '$(SRCROOT)/third_party/nexo/src/core', '$(SRCROOT)/third_party/nexo/src/core/arm64', '$(SRCROOT)/third_party/nexo/src/core/memory', '$(SRCROOT)/build-metal/MoltenVK/MoltenVK/include']
targets:
  SwitchEngine:
    type: library.static
    platform: iOS
    sources:
      - path: third_party/nexo/src
        excludes: ['core/arm64/fp_ops.cpp']
      - path: third_party/nexo/src/core/arm64/fp_ops.cpp
        compilerFlags: '-frounding-math'
      - core/runtime
      - core/native
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: ['$(inherited)', 'NEXO2_HAS_VULKAN=1', 'SWITCHCORE_MOLTENVK=1']
  SwitchCore:
    type: application
    platform: iOS
    sources:
      - path: apps/ios
        excludes: ['Resources/**', 'SwitchCore.entitlements']
      - path: apps/ios/Resources
        buildPhase: resources
    dependencies:
      - target: SwitchEngine
      - sdk: libc++.tbd
      - framework: build-metal/MoltenVK/MoltenVK/static/MoltenVK.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: IOSurface.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: MetalKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sminikiller.SwitchCore
        SWIFT_OBJC_BRIDGING_HEADER: apps/ios/App/Bridge.h
        # Device builds only: CI signs the IPA ad hoc with this file, the user's signer replaces it.
        'CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]': apps/ios/SwitchCore.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwitchCore
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  SwitchCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - tests/ios-engine
      - path: tests/integration/nfm-race.txt
        buildPhase: resources
      - apps/ios/Library/ExtractedGame.swift
      - path: third_party/nexo/tests/generated/triangle.nro
        buildPhase: resources
      - path: build-fixtures/hbmenu.nro
        buildPhase: resources
        optional: true
      - path: build-fixtures/nfm_switch.nro
        buildPhase: resources
        optional: true
    dependencies:
      - target: SwitchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sminikiller.SwitchCore.Tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: apps/ios/App/Bridge.h
  SwitchCoreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [tests/ios]
    dependencies:
      - target: SwitchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sminikiller.SwitchCore.UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SwitchCore:
    build:
      targets:
        SwitchCore: all
    test:
      targets: [SwitchCoreTests, SwitchCoreUITests]

