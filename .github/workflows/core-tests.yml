name: Core
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['third_party/**', 'core/**', 'backends/**', 'tools/**', 'tests/**', 'CMakeLists.txt', 'apps/ios/Resources/**', '.github/workflows/core-tests.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure --output-junit report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: |
            build/report.xml
            build/Testing/Temporary/LastTest.log
            build/rally.ppm

