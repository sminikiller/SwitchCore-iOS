name: Core
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['third_party/**', 'core/**', 'backends/**', 'tools/**', 'tests/**', 'CMakeLists.txt', 'cmake/**', 'apps/ios/Resources/**', '.github/workflows/core-tests.yml']
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run --spec clang-format==18.1.8 clang-format --dry-run --Werror core/runtime/* core/native/* backends/*/*.hpp tools/probe.cpp tools/native-probes.cpp tests/integration/runtime_tests.cpp
      - run: clang++ --analyze -Xanalyzer -analyzer-output=text -std=c++20 -I. -Ithird_party/nexo/src -Ithird_party/nexo/src/core -Ithird_party/nexo/src/core/memory -Ithird_party/nexo/src/core/arm64 core/runtime/SwitchCore.cpp
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure --output-junit report.xml
      - name: Independent homebrew menu launches Rally
        shell: bash
        run: |
          probe=build/switchcore-probe
          if [[ "$RUNNER_OS" == Windows ]]; then probe=build/Release/switchcore-probe.exe; fi
          python tools/verify-independent.py "$probe" build/independent
      - name: Native execution probes
        if: runner.os == 'macOS'
        run: build/native-probes | tee build/native-probes.txt
      - name: Recompiler and interpreter on the same guest code
        if: runner.os == 'macOS'
        shell: bash
        run: build/jit-bench | tee build/jit-bench.txt
      - name: Independent homebrew menu launches Rally on the recompiler
        if: runner.os == 'macOS'
        shell: bash
        run: SWITCHCORE_JIT=1 python tools/verify-independent.py build/switchcore-probe build/independent-jit
      - name: Rally soak on both CPU paths
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for cpu in interpreter jit; do
            flag=; if [[ $cpu == jit ]]; then flag=--jit; fi
            build/switchcore-probe $flag apps/ios/Resources/rally.nro build/soak-$cpu soak > build/soak-$cpu.txt ||
              { tail -n 40 build/soak-$cpu.txt; exit 1; }
            grep '^title=' build/soak-$cpu.txt
          done
      - name: Need for Madness race on both CPU paths
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          python tools/verify-independent.py --fetch-only build/fixtures
          for cpu in jit interpreter; do
            flag=; if [[ $cpu == jit ]]; then flag=--jit; fi
            build/switchcore-replay $flag build/fixtures/nfm_switch.nro build/nfm-$cpu tests/integration/nfm-race.txt \
              build/nfm-$cpu-frames 600 > build/nfm-$cpu.txt 2>&1 || { tail -n 40 build/nfm-$cpu.txt; exit 1; }
            tail -n 3 build/nfm-$cpu.txt
          done
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: recompiler-${{ matrix.os }}
          path: |
            build/jit-bench.txt
            build/soak-*.txt
            build/nfm-*.txt
            build/rally-jit.ppm
            build/independent-jit/hbmenu.ppm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: |
            build/report.xml
            build/Testing/Temporary/LastTest.log
            build/rally.ppm
            build/independent/hbmenu.ppm
            build/native-probes.txt

