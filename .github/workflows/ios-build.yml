name: iOS
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['apps/**', 'core/**', 'backends/**', 'third_party/**', 'project.yml', 'tests/ios/**', 'tests/ios-engine/**', 'tools/prepare-metal.sh', 'tools/verify-independent.py', '.github/workflows/ios-build.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device-and-simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: bash tools/prepare-metal.sh
      - run: python3 tools/verify-independent.py --fetch-only build-fixtures
      - run: xcodegen generate
      - name: Build arm64 device app
        run: |
          set -o pipefail
          xcodebuild -quiet -scheme SwitchCore -configuration Release -destination 'generic/platform=iOS' -derivedDataPath out/device CODE_SIGNING_ALLOWED=NO | tee device.log
          mkdir Payload
          cp -R out/device/Build/Products/Release-iphoneos/SwitchCore.app Payload/
          file Payload/SwitchCore.app/SwitchCore | grep arm64
          ditto -c -k --keepParent Payload SwitchCore-unsigned.ipa
      - name: Sign the IPA ad hoc with the app entitlements
        run: |
          # Signers that copy the app's own entitlements find them in this signature; signers that take them
          # from the provisioning profile replace them (docs/iphone.md). iOS reads the DER form.
          codesign --force --sign - --entitlements apps/ios/SwitchCore.entitlements --generate-entitlement-der --timestamp=none Payload/SwitchCore.app
          codesign --verify --verbose=2 Payload/SwitchCore.app
          python3 - Payload/SwitchCore.app/SwitchCore apps/ios/SwitchCore.entitlements <<'EOF' | tee entitlements.txt
          import plistlib, struct, sys
          binary = open(sys.argv[1], "rb").read()
          expected = plistlib.load(open(sys.argv[2], "rb"))
          assert struct.unpack_from("<I", binary, 0)[0] == 0xFEEDFACF, "thin arm64 Mach-O expected"
          offset, slots = 32, {}
          for _ in range(struct.unpack_from("<I", binary, 16)[0]):
              command, size = struct.unpack_from("<II", binary, offset)
              if command == 0x1D:  # LC_CODE_SIGNATURE -> SuperBlob with one blob per slot
                  base = struct.unpack_from("<I", binary, offset + 8)[0]
                  magic, _, count = struct.unpack_from(">III", binary, base)
                  assert magic == 0xFADE0CC0, hex(magic)
                  for index in range(count):
                      slot, at = struct.unpack_from(">II", binary, base + 12 + 8 * index)
                      kind, length = struct.unpack_from(">II", binary, base + at)
                      slots[slot] = (kind, binary[base + at + 8 : base + at + length])
              offset += size
          assert slots[5][0] == 0xFADE7171 and plistlib.loads(slots[5][1]) == expected, slots.get(5)
          assert slots.get(7, (0, b""))[0] == 0xFADE7172, "DER entitlements missing"
          print("Ad hoc signature with XML and DER entitlements:", ", ".join(f"{k}={v}" for k, v in sorted(expected.items())))
          EOF
          ditto -c -k --keepParent Payload SwitchCore.ipa
      - name: Run the game on an iPhone simulator
        run: |
          set -o pipefail
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for r,ds in reversed(list(json.load(sys.stdin)["devices"].items())) if "iOS" in r for d in ds if "iPhone" in d["name"]))')
          xcrun simctl boot "$id" || true
          xcrun simctl bootstatus "$id" -b
          xcodebuild test -scheme SwitchCore -configuration Release -destination "id=$id" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 600 -derivedDataPath out/sim -resultBundlePath Gameplay.xcresult > simulator.log 2>&1 || { tail -180 simulator.log; exit 1; }
          tail -35 simulator.log
      - name: Record XCTest results and screenshots
        if: always() && hashFiles('Gameplay.xcresult/Info.plist') != ''
        run: |
          xcrun xcresulttool get test-results summary --path Gameplay.xcresult > test-summary.json
          cat test-summary.json
          xcrun xcresulttool export attachments --path Gameplay.xcresult --output-path screenshots
          xcrun xcresulttool export diagnostics --path Gameplay.xcresult --output-path diagnostics || true
          find diagnostics -name '*.ips' -print 2>/dev/null || true
          python3 -c 'import json; s=json.load(open("test-summary.json")); assert s["passedTests"] >= 3 and s["totalTestCount"] >= 3 and s["failedTests"] == 0 and s["skippedTests"] == 0, s'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-evidence
          path: |
            *.log
            Gameplay.xcresult
            test-summary.json
            screenshots/
            diagnostics/
            entitlements.txt
            SwitchCore.ipa
            SwitchCore-unsigned.ipa

